org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
loom.ignoreDependencyLoomVersionValidation=true

# Mod Attributes
modId=hotbarslotcycling
modName=Hotbar Slot Cycling
modVersion=21.1.1
modAuthor=Fuzs
modDescription=A library for quickly switching out hotbar slots with different items.
modLicense=MPL-2.0
modSourceUrl=https://github.com/Fuzss/hotbarslotcycling
modIssueUrl=https://github.com/Fuzss/hotbarslotcycling/issues
modUpdateUrl=https://raw.githubusercontent.com/Fuzss/modresources/main/update/hotbarslotcycling.json
modMavenGroup=fuzs.hotbarslotcycling
# "MATCH_VERSION" for a mod required on both sides, "IGNORE_SERVER_VERSION" for a server only mod, "IGNORE_ALL_VERSION" for a client only mod
modForgeDisplayTest=IGNORE_ALL_VERSION
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
modFabricEnvironment=*

# Version Catalog
dependenciesVersionCatalog=1.21.1-SNAPSHOT
#dependenciesPuzzlesLibVersion=21.1.15
#dependenciesMinPuzzlesLibVersion=21.1.15

# Mod Publishing
projectReleaseType=release
projectCurseForgeId=0
projectModrinthId=0

# Required Dependencies
dependenciesRequiredFabricCurseForge=fabric-api, forge-config-api-port, puzzles-lib
dependenciesRequiredNeoForgeCurseForge=puzzles-lib
dependenciesRequiredForgeCurseForge=forge-config-api-port, puzzles-lib
dependenciesRequiredFabricModrinth=fabric-api, forge-config-api-port, puzzles-lib
dependenciesRequiredNeoForgeModrinth=puzzles-lib
dependenciesRequiredForgeModrinth=forge-config-api-port, puzzles-lib
